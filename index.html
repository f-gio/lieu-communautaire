/* Sondages — collection Firestore dédiée */
let pollsCache=[];
let pollsUnsub=null;

function isAdmin(){ return auth.currentUser?.uid===ADMIN_UID; }

function startPollsSync(){
  if(pollsUnsub) pollsUnsub();
  pollsUnsub=onSnapshot(collection(db,'polls'),snap=>{
    pollsCache=snap.docs.map(d=>({id:d.id,...d.data()}));
    pollsCache.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    renderPolls();
  });
}

function addPollOptionField(value=''){
 const row=document.createElement('div');row.className='poll-option-edit';
 const inp=document.createElement('input');inp.placeholder='Réponse proposée';inp.value=value;
 const del=document.createElement('button');del.className='btn secondary';del.textContent='×';del.type='button';del.onclick=()=>row.remove();
 row.append(inp,del);pollOptionsEditor.appendChild(row);
}

function openPollModal(id=null){
 if(!isAdmin()) return;
 editingPollId=id;pollError.textContent='';pollOptionsEditor.innerHTML='';
 const p=id?pollsCache.find(x=>x.id===id):null;
 pollModalTitle.textContent=p?'Modifier le sondage':'Créer un sondage';
 pollQuestion.value=p?.question||'';pollDescription.value=p?.description||'';pollDeadline.value=p?.deadline||'';
 (p?.options||['','']).forEach(o=>addPollOptionField(typeof o==='string'?o:o.label));
 deletePollBtn.style.display=p?'inline-block':'none';pollModal.style.display='block';
}

function closePoll(){pollModal.style.display='none';editingPollId=null}

function renderPolls(){
 if(!document.getElementById('pollList'))return;
 addPollBtn.style.display=isAdmin()?'inline-block':'none';
 pollList.innerHTML=pollsCache.length?'':'<div class="card"><p class="intro">Aucun sondage pour le moment.</p></div>';

 pollsCache.forEach(p=>{
  const votes=p.votes||{};
  const uid=auth.currentUser?.uid||null;
  const myVote=uid && Object.prototype.hasOwnProperty.call(votes,uid) ? Number(votes[uid]) : null;
  const counts=(p.options||[]).map((_,i)=>Object.values(votes).filter(v=>Number(v)===i).length);
  const total=Object.keys(votes).length;
  const isClosed=p.deadline && p.deadline < calISO(new Date());

  const card=document.createElement('div');card.className='card poll-card';
  const deadline=p.deadline?' · Clôture '+new Date(p.deadline+'T12:00:00').toLocaleDateString('fr-FR'):'';
  card.innerHTML=
    '<h2 style="margin:0">'+esc(p.question)+'</h2>'+
    '<div class="poll-meta"><span class="poll-status">'+(isClosed?'Clôturé':'Sondage')+'</span><span>'+total+' vote'+(total>1?'s':'')+deadline+'</span></div>'+
    (p.description?'<p>'+esc(p.description)+'</p>':'')+
    '<div class="poll-options"></div>'+
    '<div class="poll-vote-footer"><span class="poll-vote-message"></span><button class="btn poll-submit" '+(isClosed?'disabled':'')+'>'+(myVote===null?'Voter':'Modifier mon vote')+'</button></div>'+
    '<div class="poll-actions"></div>';

  const opts=card.querySelector('.poll-options');
  (p.options||[]).forEach((o,i)=>{
    const label=typeof o==='string'?o:o.label;
    const pct=total?Math.round(counts[i]*100/total):0;
    const row=document.createElement('label');row.className='poll-choice'+(myVote===i?' selected':'');
    row.innerHTML=
      '<span class="poll-choice-main"><input type="radio" name="poll-'+p.id+'" value="'+i+'" '+(myVote===i?'checked':'')+' '+(isClosed?'disabled':'')+'><span class="poll-choice-label">'+esc(label)+'</span></span>'+
      '<div class="poll-bar"><div class="poll-fill" style="width:'+pct+'%"></div></div>'+
      '<span class="poll-vote-count">'+counts[i]+' · '+pct+'%</span>';
    opts.appendChild(row);
  });

  const msg=card.querySelector('.poll-vote-message');
  if(isClosed) msg.textContent='Ce sondage est clôturé.';
  else if(myVote!==null) msg.textContent='Votre vote est enregistré. Vous pouvez le modifier.';
  else msg.textContent='Sélectionnez une réponse.';

  const submit=card.querySelector('.poll-submit');
  submit.onclick=async()=>{
    if(!uid){msg.textContent='Vous devez être connecté pour voter.';return}
    const checked=card.querySelector('input[type="radio"]:checked');
    if(!checked){msg.textContent='Sélectionnez une réponse avant de voter.';return}
    submit.disabled=true;submit.textContent='Enregistrement…';
    try{
      await updateDoc(doc(db,'polls',p.id),{['votes.'+uid]:Number(checked.value)});
    }catch(e){
      console.error(e);msg.textContent="Impossible d'enregistrer le vote.";
      submit.disabled=false;
    }
  };

  opts.onchange=()=>{
    [...opts.querySelectorAll('.poll-choice')].forEach(x=>x.classList.toggle('selected',!!x.querySelector('input:checked')));
    submit.textContent=myVote===null?'Voter':'Enregistrer mon nouveau vote';
  };

  const actions=card.querySelector('.poll-actions');
  if(isAdmin()){
    const edit=document.createElement('button');edit.className='btn secondary';edit.textContent='Modifier le sondage';edit.onclick=()=>openPollModal(p.id);
    actions.appendChild(edit);
  } else {
    actions.style.display='none';
  }
  pollList.appendChild(card);
 });
}

addPollBtn.onclick=()=>openPollModal();
closePollModal.onclick=closePoll;cancelPollBtn.onclick=closePoll;addPollOption.onclick=()=>addPollOptionField();

savePollBtn.onclick=async()=>{
 if(!isAdmin()){pollError.textContent='Action réservée à un administrateur.';return}
 const labels=[...pollOptionsEditor.querySelectorAll('input')].map(x=>x.value.trim()).filter(Boolean);
 if(!pollQuestion.value.trim()||labels.length<2){pollError.textContent='Saisissez une question et au moins deux réponses.';return}
 const old=editingPollId?pollsCache.find(x=>x.id===editingPollId):null;
 const options=labels.map(label=>({label}));
 const id=editingPollId||crypto.randomUUID();
 const payload={question:pollQuestion.value.trim(),description:pollDescription.value.trim(),deadline:pollDeadline.value,options,votes:old?.votes||{},updatedAt:serverTimestamp()};
 if(!editingPollId) payload.createdAt=serverTimestamp();
 await setDoc(doc(db,'polls',id),payload,{merge:true});
 closePoll();
};

deletePollBtn.onclick=async()=>{
 if(!isAdmin()||!editingPollId)return;
 if(confirm('Supprimer définitivement ce sondage ?')){
   await deleteDoc(doc(db,'polls',editingPollId));
   closePoll();
 }
};
onAuthStateChanged(auth,async user=>{
if(unsub){unsub();unsub=null}
approvalMessage.style.display='none';
if(!user){if(pollsUnsub){pollsUnsub();pollsUnsub=null} adminBtn.style.display='none';overlay.style.display='block';logout.hidden=true;loginBtn.style.display='';signupBtn.style.display='';loginEmail.style.display='';loginPassword.style.display='';return}
adminBtn.style.display=user.uid===ADMIN_UID?'inline-block':'none';
const userRef=doc(db,'users',user.uid);
let profile=await getDoc(userRef);
if(!profile.exists()){
  await setDoc(userRef,{
    email:user.email,
    status:user.uid===ADMIN_UID?'approved':'pending',
    createdAt:serverTimestamp()
  });
  profile=await getDoc(userRef);
}
const status=profile.data()?.status||'pending';

// L'administrateur principal passe toujours directement.
if(user.uid!==ADMIN_UID && status!=='approved'){
overlay.style.display='block';logout.hidden=false;loginBtn.style.display='none';signupBtn.style.display='none';loginEmail.style.display='none';loginPassword.style.display='none';approvalMessage.style.display='block';
approvalMessage.innerHTML=status==='rejected'
?'<strong>Demande refusée.</strong><br>Votre compte n’a pas été autorisé à accéder à cet espace.'
:status==='suspended'
?'<strong>Compte suspendu.</strong><br>Votre accès à l’espace communautaire a été temporairement suspendu.'
:'<strong>Inscription enregistrée.</strong><br>Votre demande est en attente de validation par un administrateur.';
return}
overlay.style.display='none';logout.hidden=false;
startPollsSync();
addPollBtn.style.display=user.uid===ADMIN_UID?'inline-block':'none';
const snap=await getDoc(projectRef);if(!snap.exists())await setDoc(projectRef,defaults);
unsub=onSnapshot(projectRef,s=>{if(s.exists()){data={...structuredClone(defaults),...s.data()};renderAll()}});
});
</script>
